############################################################################
# General
############################################################################
# Screen like binding
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

set -g mouse on
set -g history-limit 50000
set -s escape-time 10          # fast Esc for (n)vim
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Use vim keybindings in copy mode, copy to macOS clipboard
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

############################################################################
# Windows & panes
############################################################################
# start numbering at 1 to match the keyboard layout
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# disable programs changing window names via terminal escape sequence
setw -g allow-rename off

# open new panes and windows with current $PWD
bind '%' split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Seamless C-h/j/k/l between vim splits and tmux panes
# (pairs with christoomey/vim-tmux-navigator in nvim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# resize panes with vi-like keybindings
bind j resize-pane -D 10
bind k resize-pane -U 10
bind h resize-pane -L 10
bind l resize-pane -R 10
